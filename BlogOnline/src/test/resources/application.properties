spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

security.jwt.private.key=dummy-key
security.jwt.user.generator=dummy-user

spring.security.oauth2.client.registration.github.client-id=dummy-id
spring.security.oauth2.client.registration.github.client-secret=dummy-secret
spring.security.oauth2.client.registration.google.client-id=dummy-id
spring.security.oauth2.client.registration.google.client-secret=dummy-secret